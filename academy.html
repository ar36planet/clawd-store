.cap{position:absolute;left:20%;top:-22%;width:60%;transform:rotate(-8deg);overflow:visible}

.lead{font-size:20px;margin:10px 0 18px;font-weight:500}
.deal{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}

.deal .now{font-size:40px;font-weight:900;line-height:1}
.deal .from{font-size:18px;font-weight:700}
.stats{color:var(--sub);font-size:15px;margin:10px 0 0}

.secsub{color:var(--sub);margin:0 0 16px}
.block{padding:26px 0 22px;border-top:2px dashed var(--soft)}

.chips{display:flex;flex-wrap:wrap;gap:12px}

.flabel{display:block;font-size:15px;color:var(--sub);margin-top:16px}

.course h3{margin:0;font-size:19px;line-height:1.35}
.course p{margin:0;color:var(--sub);font-size:14px;flex:1}
.course .meta{font-size:13px;color:var(--sub)}
.course .why{font-size:13px;color:var(--new);font-weight:700;min-height:0}
.course .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:4px}
.course .row s{color:var(--sub);font-size:14px}
.course .row b{font-size:20px}
.course .tick{width:26px;height:26px;border:2.5px solid var(--soft);border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:15px;color:transparent;flex:none}
.course:has(input:checked) .tick{background:var(--pick);border-color:var(--pick);color:#fff}

.reviews{display:grid;gap:14px}

.review{padding:16px;margin:0;--line-c:var(--soft)}
.review blockquote{margin:0 0 10px;font-size:16px;font-weight:500;white-space:pre-line}
.review figcaption{color:var(--sub);font-size:14px}
.stars{color:#e8a91f;letter-spacing:2px;margin-bottom:6px}

.faq dt{font-weight:700;margin-top:12px}

.buy:hover{transform:rotate(-.6deg) scale(1.03)}
.buy:active{transform:rotate(-.6deg) scale(.97)}
.ghost{background:transparent;color:var(--ink)}

.foot{max-width:1100px;margin:0 auto;padding:20px 20px 30px;color:var(--sub);font-size:13px}

.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}

       mSub:(n,c)=>`${n} 已修畢 ${c} 門課。成績單在下面，請不要給牠看。`, saved:'證書已下載',
       cert:{ head:'結業證書', certify:'茲證明', took:'已修畢下列課程，成績如下：', date:'結業日期', dean:'院長', deanNote:'（僅對受邀學員授課）', seal:'結業',
              fine:'本證書為 fan art 惡搞作品，不具任何學歷效力。' } },
  en:{ ann:'Limited-time offer. When it ends, it gets extended.', title:'Send Your Clawd<br>Back to School', lead:'Writing tests, reading requirements, saying "I don\'t know". Certificate included.', from:'from',
       stats:'12,847 Clawds graduated | Graduates run 3% more tests on average', who:"Who's going to class?", whoSub:'Some courses are model-specific.', nameL:'Student name (printed on the certificate)',
       courses:'Courses', coursesSub:'Pick as many as you like. More courses, longer certificate.', reviews:'Student reviews', faq:'FAQ', enroll:'Enroll now',
       foot:'Unofficial fan-art parody, not affiliated with Anthropic. No real courses.', backLink:'Back to store', mTitle:'Congratulations!', dl:'Save certificate', share:'Share', close:'Close',
       hold:'You can also long-press the certificate to save it.', certAlt:'CLAWD ACADEMY certificate', capAlt:'Clawd wearing a graduation cap',
       only:m=>`${m} only`, exempt:m=>`${m} exempt`, whyOnly:m=>`${m} only`, whyExempt:m=>`${m} is already short`,
       fableLock:'Fable already knows everything. It just can\'t say.', extended:'Offer extended! 10 more minutes.',
       none:'No courses yet', count:n=>`${n} course${n>1?'s':''}`, monthly:v=>`or 24 payments of USD ${v}/mo`, errNone:'Pick at least one course. Clawd is waiting at the door.',
       mSub:(n,c)=>`${n} completed ${c} course${c>1?'s':''}. Transcript below. Please don't show it.`, saved:'Certificate saved',
       cert:{ head:'CERTIFICATE OF COMPLETION', certify:'This certifies that', took:'has completed the following courses:', date:'Date', dean:'Dean', deanNote:'(teaches invited students only)', seal:'GRAD',
              fine:'This certificate is a fan-art parody and has no academic standing.' } },
};

const $ = id => document.getElementById(id);
let lang = 'zh';
try{ lang = localStorage.getItem('clawd-lang') || ''; }catch(e){}
if(lang!=='zh' && lang!=='en') lang = /^zh/i.test(navigator.language||'') ? 'zh' : 'en';
const t = k => UI[lang][k];
const fromQuery = new URLSearchParams(location.search).get('model');
const state = { model: MODELS.some(m=>m.id===fromQuery && !m.locked) ? fromQuery : 'opus', picked:new Set() };
const mlabel = id => MODELS.find(m=>m.id===id).label;

function allowed(c){ return !(c.only && c.only!==state.model) && !(c.exempt && c.exempt===state.model); }

function render(){
  $('models').innerHTML = MODELS.map(m=> m.locked
    ? `<button type="button" class="chip locked" data-locked="${m.id}" aria-disabled="true"><span class="hand sk">${m.label}</span></button>`
    : `<label class="chip"><input type="radio" name="model" value="${m.id}" ${state.model===m.id?'checked':''}><span class="hand sk">${m.label}</span></label>`).join('');
  $('courses').innerHTML = COURSES.map(c=>{
    const L=c[lang], ok=allowed(c);
    const badge = c.only ? t('only')(mlabel(c.only)) : c.exempt ? t('exempt')(mlabel(c.exempt)) : '';
    const why = ok ? '' : c.only ? t('whyOnly')(mlabel(c.only)) : t('whyExempt')(mlabel(c.exempt));
    return `<label class="course sk"><input type="checkbox" value="${c.id}" ${state.picked.has(c.id)?'checked':''} ${ok?'':'disabled'}>
      <span class="badge">${badge}</span>
      <h3>${L.name}</h3><p>${L.desc}</p><span class="meta">⏱ ${L.len}</span>${why?`<span class="why">${why}</span>`:''}
      <span class="row"><span><s>USD ${c.was}</s> <b>USD ${c.price}</b></span><span class="tick" aria-hidden="true">✓</span></span></label>`;
  }).join('');
  $('reviews').innerHTML = REVIEWS[lang].map(r=>`<figure class="review sk"><div class="stars" aria-label="5/5">★★★★★</div><blockquote></blockquote><figcaption></figcaption></figure>`).join('');
  [...$('reviews').children].forEach((el,i)=>{ el.querySelector('blockquote').textContent = REVIEWS[lang][i].q; el.querySelector('figcaption').textContent = '— ' + REVIEWS[lang][i].who; });
  $('faq').innerHTML = '';
  for(const [q,a] of FAQ[lang]){ const dt=document.createElement('dt'), dd=document.createElement('dd'); dt.textContent=q; dd.textContent=a; $('faq').append(dt,dd); }
  update();
}
function update(){
  const list = COURSES.filter(c=>state.picked.has(c.id));
  const sum = list.reduce((s,c)=>s+c.price,0);
  $('total').textContent = 'USD ' + sum;
  $('summary').textContent = list.length ? `${t('count')(list.length)}・${t('monthly')((sum/24).toFixed(2))}` : t('none');
}
function applyLang(){
  document.documentElement.lang = lang==='en' ? 'en' : 'zh-Hant';
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const v = t(el.dataset.i18n);
    if(el.dataset.i18n==='title') el.innerHTML = v; else el.textContent = v;
  });
  $('certImg').alt = t('certAlt'); $('clawdImg').alt = t('capAlt');
  $('langBtn').textContent = lang==='en' ? '中文' : 'EN';
  $('langBtn').setAttribute('aria-label', lang==='en' ? '切換成中文' : 'Switch to English');
  $('err').textContent = '';
  render();
  if($('modal').classList.contains('open') && lastCert) showCert();
}

let tt;
function toast(msg){ const el=$('toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('show'),2600); }

$('models').addEventListener('change', e=>{
  const m = MODELS.find(x=>x.id===e.target.value);
  if(!m || m.locked){ render(); return; }
  state.model = m.id;
  for(const id of [...state.picked]) if(!allowed(COURSES.find(c=>c.id===id))) state.picked.delete(id);
  render();
});
$('models').addEventListener('click', e=>{ if(e.target.closest('[data-locked]')) toast(t('fableLock')); });
$('courses').addEventListener('change', e=>{
  const id = e.target.value; e.target.checked ? state.picked.add(id) : state.picked.delete(id);
  $('err').textContent = ''; update();
});

/* 限時優惠：每次重新整理都從 09:59 開始 */
let left = 599;
setInterval(()=>{
  left--;
  if(left < 0){ left = 599; toast(t('extended')); }
  $('clock').textContent = `${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`;
}, 1000);

/* ---------- certificate ---------- */
function wobblyLine(x, x1, y1, x2, y2, w=3){
  x.lineWidth = w; x.lineCap='round'; x.beginPath();
  const steps = Math.max(2, Math.floor(Math.hypot(x2-x1,y2-y1)/40));
  x.moveTo(x1, y1);
  for(let i=1;i<=steps;i++){ const k=i/steps; x.lineTo(x1+(x2-x1)*k + (Math.random()-.5)*2.2, y1+(y2-y1)*k + (Math.random()-.5)*2.2); }
  x.stroke();
}
function wobblyRect(x, a, b, w, h, lw){ wobblyLine(x,a,b,a+w,b,lw); wobblyLine(x,a+w,b,a+w,b+h,lw); wobblyLine(x,a+w,b+h,a,b+h,lw); wobblyLine(x,a,b+h,a,b,lw); }
function drawCap(x, cx, top, w){
  const s=w/200; x.save(); x.translate(cx-w/2, top); x.scale(s,s); x.rotate(-.14);
  x.fillStyle='#1b1b1b';
  x.beginPath(); x.moveTo(60,52); x.lineTo(60,82); x.quadraticCurveTo(100,98,140,82); x.lineTo(140,52); x.closePath(); x.fill();
  x.beginPath(); x.moveTo(100,14); x.lineTo(192,44); x.lineTo(100,74); x.lineTo(8,44); x.closePath(); x.fill();
  x.strokeStyle='#ffd21f'; x.lineWidth=5; x.lineCap='round'; x.beginPath(); x.moveTo(100,44); x.lineTo(166,56); x.lineTo(166,88); x.stroke();
  x.fillStyle='#ffd21f'; x.beginPath(); x.moveTo(160,86); x.lineTo(172,86); x.lineTo(170,104); x.lineTo(162,104); x.closePath(); x.fill();
  x.restore();
}

let lastCert = null, blob = null;
async function drawCert(cert){
  try{ await document.fonts.ready }catch(e){}
  const im = $('clawdImg'); if(!im.complete) await new Promise(r=>im.onload=r);
  const C = t('cert'), f = '"Noto Sans TC","PingFang TC",sans-serif';
  const W=1400, rowH=54, H=836 + cert.courses.length*rowH;
  const c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d');
  x.fillStyle='#fffdf7'; x.fillRect(0,0,W,H);
  x.strokeStyle='#1b1b1b'; wobblyRect(x,28,28,W-56,H-56,5); wobblyRect(x,48,48,W-96,H-96,2);

  const iw=170, ih=im.naturalHeight*iw/im.naturalWidth, ix=W-110-iw, iy=120;
  x.drawImage(im, ix, iy, iw, ih); drawCap(x, ix+iw/2+4, iy-50, iw*.78);

  x.textAlign='center';
  x.fillStyle='#d9765a'; x.font=`900 46px ${f}`; x.fillText('CLAWD ACADEMY',W/2,140);
  x.fillStyle='#1b1b1b'; x.font=`900 ${lang==='en'?50:64}px ${f}`; x.fillText(C.head,W/2,225);
  x.fillStyle='#555'; x.font=`30px ${f}`; x.fillText(C.certify,W/2,288);
  x.fillStyle='rgba(255,210,31,.7)'; x.save(); x.translate(W/2,392); x.rotate(-.01); x.fillRect(-260,-10,520,26); x.restore();
  x.fillStyle='#1b1b1b'; x.font=`900 76px ${f}`;
  let nm=cert.name; while(x.measureText(nm).width>800 && nm.length>2) nm=nm.slice(0,-2)+'…';
  x.fillText(nm,W/2,392);
  x.fillStyle='#555'; x.font=`500 28px ${f}`; x.fillText(`(${cert.ver})`,W/2,440);
  x.font=`30px ${f}`; x.fillText(C.took,W/2,504);

  let y=576; x.textAlign='left';
  for(const row of cert.courses){
    const co = COURSES.find(k=>k.id===row.id)[lang];
    x.fillStyle='#1b1b1b'; x.font=`500 30px ${f}`; x.fillText(co.name,200,y);
    x.textAlign='right'; x.font=`700 30px ${f}`; x.fillStyle = /^(A|你說得|You're|我不知道|I don't)/.test(co.grades[row.g]) ? '#1e6fe8' : '#1b1b1b';
    x.fillText(co.grades[row.g],W-200,y); x.textAlign='left';
    x.strokeStyle='#d0d0d0'; x.setLineDash([4,8]); x.lineWidth=2; x.beginPath(); x.moveTo(200,y+16); x.lineTo(W-200,y+16); x.stroke(); x.setLineDash([]);
    y+=rowH;
  }

  const by=H-130, d=new Date(cert.at), p=n=>String(n).padStart(2,'0');
  x.strokeStyle='#1b1b1b'; wobblyLine(x,150,by-36,520,by-36,2.5); wobblyLine(x,W-520,by-36,W-150,by-36,2.5);
  x.fillStyle='#555'; x.font=`26px ${f}`; x.textAlign='center';
  x.fillText(`${C.date} ${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())}`,335,by);
  x.fillText(`${C.dean}  Mythos`,W-335,by);
  x.fillStyle='#8a8a8a'; x.font=`20px ${f}`; x.fillText(C.deanNote,W-335,by+28);
  // signature scribble
  x.strokeStyle='#1e3a8a'; x.lineWidth=3; x.lineCap='round'; x.beginPath(); x.moveTo(W-470,by-50);
  for(let i=0;i<9;i++){ x.bezierCurveTo(W-450+i*32,by-110, W-440+i*32,by-30, W-425+i*32,by-62); }
  x.stroke();
  // seal
  x.save(); x.translate(W/2, by-40); x.rotate(-.18);
  x.strokeStyle='#e8261f'; x.lineWidth=5; x.beginPath(); x.arc(0,0,64,0,Math.PI*2); x.stroke();
  x.lineWidth=2; x.beginPath(); x.arc(0,0,54,0,Math.PI*2); x.stroke();
  x.fillStyle='#e8261f'; x.font=`900 ${lang==='en'?30:40}px ${f}`; x.fillText(C.seal,0,14); x.restore();

  x.fillStyle='#8a8a8a'; x.font=`22px ${f}`; x.fillText(C.fine,W/2,H-62);
  return c;
}
async function showCert(){
  const c = await drawCert(lastCert);
  $('certImg').src = c.toDataURL('image/png');
  blob = await new Promise(r=>c.toBlob(r,'image/png'));
  $('mSub').textContent = t('mSub')(lastCert.name, lastCert.courses.length);
  $('shareBtn').hidden = !(navigator.canShare && navigator.canShare({ files:[new File([blob], fname(), { type:'image/png' })] }));
  if(!$('modal').classList.contains('open')){ $('modal').classList.add('open'); $('dlBtn').focus(); }
}
const fname = () => `clawd-academy-${lastCert.at}.png`;

$('enroll').onclick = ()=>{
  const ids = COURSES.filter(c=>state.picked.has(c.id)).map(c=>c.id);
  if(!ids.length){ $('err').textContent = t('errNone'); $('courses').scrollIntoView({behavior:'smooth', block:'start'}); return; }
  const m = MODELS.find(x=>x.id===state.model);
  lastCert = { name: $('cname').value.trim() || 'Clawd', ver: m.ver, at: Date.now(),
               courses: ids.map(id=>({ id, g: Math.floor(Math.random()*3) })) };
  showCert();
};
$('dlBtn').onclick = ()=>{
  if(!blob) return;
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fname();
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast(t('saved'));
};
$('shareBtn').onclick = async ()=>{
  try{ await navigator.share({ files:[new File([blob], fname(), { type:'image/png' })], title:'CLAWD ACADEMY', url:location.href.split('?')[0] }); }catch(e){}
};
$('closeBtn').onclick = ()=>$('modal').classList.remove('open');
$('modal').addEventListener('click', e=>{ if(e.target.id==='modal') $('closeBtn').click(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && $('modal').classList.contains('open')) $('closeBtn').click(); });
$('langBtn').onclick = ()=>{ lang = lang==='en' ? 'zh' : 'en'; try{ localStorage.setItem('clawd-lang', lang); }catch(e){} applyLang(); };

applyLang();
</script>
