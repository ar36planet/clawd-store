<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CLAWD STORE</title>
<meta name="description" content="Clawd 線上商店（惡搞 fan art）：挑型號、殼色、思考容量，下單拿一張收據。">
<meta property="og:title" content="CLAWD STORE">
<meta property="og:description" content="挑一隻 Clawd，下單拿一張收據。非官方 fan art。">
<meta property="og:type" content="website">
<meta name="theme-color" content="#d9765a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦀</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ffffff; --ink:#1b1b1b; --sub:#8a8a8a; --soft:#c9c9c9;
  --clawd:#d9765a; --new:#e8261f; --pick:#1e6fe8; --pick-fill:#aac2ec;
  --buy:#ffd21f; --buy-ink:#1b1b1b; --hi:rgba(255,210,31,.55);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1c1b1a; --ink:#f1efe9; --sub:#9b9892; --soft:#4a4844;
    --pick-fill:#2c4a7a; --pick:#6aa2ff; --hi:rgba(255,210,31,.3);
  }
}
:root[data-theme="dark"]{
  --paper:#1c1b1a; --ink:#f1efe9; --sub:#9b9892; --soft:#4a4844;
  --pick-fill:#2c4a7a; --pick:#6aa2ff; --hi:rgba(255,210,31,.3);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:17px;line-height:1.55;
}
.hand{font-weight:700}
img{max-width:100%}
button,input,label{font:inherit;color:inherit}
:focus-visible{outline:3px dashed var(--pick);outline-offset:3px}

/* sketchy border helper */
.sk{position:relative}
.sk::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  border:2.5px solid var(--line-c,var(--ink));border-radius:3px;filter:url(#wobble);
}

/* header */
.top{max-width:1100px;margin:0 auto;padding:18px 20px 0;display:flex;justify-content:space-between;align-items:center}
.logo{white-space:nowrap;font-size:clamp(28px,8vw,60px);color:var(--clawd);line-height:1;margin:0;font-weight:900;letter-spacing:.04em}
.tools{display:flex;align-items:center;gap:6px}
.lang{border:2px solid var(--soft);background:transparent;border-radius:999px;padding:2px 12px;font-size:15px;cursor:pointer;white-space:nowrap}
.lang:hover{border-color:var(--sub)}
.cart{font-size:22px;padding:6px 0 6px 14px;white-space:nowrap}
.cart b{display:inline-block;min-width:26px;text-align:center;background:var(--new);color:#fff;border-radius:50%;font-size:16px;line-height:26px;margin-left:4px}

/* product */
.wrap{max-width:1100px;margin:0 auto;padding:0 20px 120px}
.product{display:grid;gap:12px;align-items:center;padding:20px 0 30px}
@media (min-width:820px){ .product{grid-template-columns:1.15fr 1fr;gap:40px;padding:40px 0 50px} }
.stage{display:grid;place-items:center;min-height:300px}
.figure{width:min(86%,440px);transition:transform .45s cubic-bezier(.3,1.5,.5,1),filter .35s}
.figure img{display:block;width:100%;height:auto}
.figure.bounce{animation:hop .5s}
@keyframes hop{30%{translate:0 -14px}60%{translate:0 0}}

.title{font-size:52px;margin:0;line-height:1;font-weight:900;letter-spacing:.04em}
.underline{height:10px;margin:2px 0 16px;max-width:380px}
.line1{display:flex;align-items:center;gap:14px;font-size:26px;margin-bottom:6px}
.tag-new{background:var(--new);color:#fff;font-size:17px;font-weight:900;padding:0 10px;line-height:30px;transform:rotate(-2deg);letter-spacing:.06em}
.tag-new[hidden]{display:none}
.price{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;margin-bottom:18px}
.price .usd{font-size:42px;line-height:1;font-weight:900}
.price .ship{color:var(--sub);font-size:20px;font-weight:500}
.price .mo{width:100%;color:var(--sub);font-size:15px;margin-top:-6px;font-weight:400}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:12px;margin:0 0 6px}
.chip{position:relative;cursor:pointer}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{
  display:inline-block;padding:6px 16px;font-size:18px;line-height:1.3;--line-c:var(--soft);
  background:var(--paper);transition:background .15s;
}
.chip span::before{border-width:3px}
.chip:hover span{--line-c:var(--sub)}
.chip input:checked + span{background:var(--pick-fill);--line-c:var(--pick)}
.chip input:focus-visible + span{outline:3px dashed var(--pick);outline-offset:3px}
.chip.locked span{color:var(--sub);cursor:not-allowed}
.chip small{font-size:15px;color:var(--sub);margin-left:4px}
.chip input:checked + span small{color:inherit}
.note{color:var(--sub);font-size:15px;min-height:1.5em;margin:6px 0 14px}

.buy{
  display:inline-flex;align-items:center;gap:10px;border:0;cursor:pointer;
  background:var(--buy);color:var(--buy-ink);font-size:28px;font-weight:900;padding:12px 40px;margin-top:20px;letter-spacing:.04em;
  transform:rotate(-.6deg);transition:transform .12s;
}
.buy:hover{transform:rotate(-.6deg) scale(1.03)}
.buy:active{transform:rotate(-.6deg) scale(.97)}

/* speech bubble */
.stage{position:relative;display:flex!important;flex-direction:column;align-items:center;gap:18px}
.bubble{
  position:relative;align-self:flex-end;margin-right:6%;max-width:min(80%,300px);z-index:2;
  background:var(--paper);padding:10px 14px;font-size:16px;font-weight:500;line-height:1.45;
  transition:opacity .2s;
}
.bubble::after{
  content:"";position:absolute;left:22px;bottom:-12px;width:16px;height:16px;background:var(--paper);
  border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:rotate(45deg) skew(8deg,8deg);
}
.bubble.peek{opacity:.0}
/* more specs */
.more{max-width:760px}
.more h2{font-size:28px;margin:0 0 4px;font-weight:900}
.more > p{color:var(--sub);margin:0 0 10px}
.group{padding:22px 0 18px;border-top:2px dashed var(--soft)}
.group h3{font-size:22px;margin:0 0 10px;font-weight:700}
.field input{width:100%;max-width:360px;font-size:20px;padding:8px 14px;border:0;background:transparent}
.field{display:inline-block}

/* accessory cards */
.shop{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (min-width:640px){ .shop{grid-template-columns:repeat(3,minmax(0,1fr))} }
.acc{padding:12px;display:flex;flex-direction:column;--line-c:var(--soft)}
.acc.in{--line-c:var(--pick)}
.acc-img{background:color-mix(in srgb,var(--soft) 22%,transparent);aspect-ratio:6/5;display:grid;place-items:center;margin-bottom:10px;color:#1b1b1b}
.acc-img svg{width:86%;height:auto;overflow:visible}
.acc h4{margin:0;font-size:16px;line-height:1.35}
.acc p{margin:4px 0 10px;font-size:13px;color:var(--sub);flex:1}
.acc-foot{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.acc-foot b{font-size:17px}
.qty{display:flex;align-items:center;border:2px solid var(--soft);border-radius:999px}
.qty button{width:32px;height:32px;border:0;background:none;font-size:20px;line-height:1;cursor:pointer;border-radius:50%}
.qty button:hover{background:color-mix(in srgb,var(--soft) 40%,transparent)}
.qty output{min-width:22px;text-align:center;font-weight:700}
/* sticky bar */
.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--paper);
  border-top:2.5px solid var(--ink);
  padding:10px 20px calc(10px + env(safe-area-inset-bottom,0px));
  transform:translateY(110%);transition:transform .25s;
}
.bar.show{transform:none}
.bar-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar .t{font-size:24px;line-height:1.1;font-weight:900}
.bar .s{color:var(--sub);font-size:14px}
.bar .buy{font-size:20px;padding:9px 22px;margin:0}

/* toast */
.toast{
  position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);
  background:var(--ink);color:var(--paper);padding:10px 18px;font-size:16px;opacity:0;pointer-events:none;
  transition:.25s;z-index:30;max-width:90vw;text-align:center;border-radius:4px;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* modal */
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
@media (min-width:700px){ .modal{align-items:center} }
.sheet{
  background:var(--paper);width:100%;max-width:520px;max-height:92%;overflow:auto;
  padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px));
}
.sheet h3{font-size:28px;margin:0;font-weight:900}
.sheet p{color:var(--sub);margin:0 0 14px}
.sheet img{width:100%;display:block;border:1px solid var(--soft);background:#fff}
.sheet .row{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
.sheet .row .buy{font-size:20px;padding:10px 22px}
.ghost{background:transparent;color:var(--ink);--line-c:var(--ink)}
.small{font-size:14px;color:var(--sub);margin-top:10px}
.foot{max-width:1100px;margin:0 auto;padding:0 20px 110px;color:var(--sub);font-size:13px}

@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>

function groupHTML(g, showTitle){
  let h = `<div class="${showTitle?'group':''}" role="${g.multi?'group':'radiogroup'}" aria-label="${tr(g,'title')}">`;
  if(showTitle) h += `<h3>${tr(g,'title')}</h3>`;
  h += '<div class="chips">';
  for(const o of g.options){
    const checked = g.multi ? state.addons.has(o.id) : state[g.id]===o.id;
    const d = (g.id!=='model' && o.price) ? `<small>${delta(o.price)}</small>` : '';
    h += `<label class="chip${o.locked?' locked':''}"><input type="${g.multi?'checkbox':'radio'}" name="${g.id}" value="${o.id}" ${checked?'checked':''}><span class="hand sk">${tr(o,'label')}${d}</span></label>`;
  }
  h += `</div><p class="note" id="note-${g.id}"></p></div>`;
  return h;
}

function items(){

  list.push({ label:`Clawd ${m.ver}${state.ed==='std'?'':' '+tr(ed,'label')}`, price:m.price+ed.price });
  for(const g of MORE){
    const o = opt(g.id, state[g.id]);
    if(o.price===0 && g.id!=='shell') continue;
    list.push({ label:`${tr(g,'title')}${t('sep')}${tr(o,'label')}`, price:o.price });
  }
  for(const a of ACC){ const n=state.qty[a.id]||0; if(n) list.push({ label:`${tr(a,'name')} ×${n}`, price:a.price*n }); }

}

function wobblyLine(x, x1, y1, x2, y2, w=3){
  x.lineWidth = w; x.lineCap='round'; x.beginPath();
  const steps = Math.max(2, Math.floor(Math.hypot(x2-x1,y2-y1)/40));
  x.moveTo(x1, y1);
  for(let i=1;i<=steps;i++){ const t=i/steps; x.lineTo(x1+(x2-x1)*t + (Math.random()-.5)*2.2, y1+(y2-y1)*t + (Math.random()-.5)*2.2); }
  x.stroke();
}
function wobblyRect(x, a, b, w, h, lw){ wobblyLine(x,a,b,a+w,b,lw); wobblyLine(x,a+w,b,a+w,b+h,lw); wobblyLine(x,a+w,b+h,a,b+h,lw); wobblyLine(x,a,b+h,a,b,lw); }

/* CSS filter → pixel ops, because Safari's canvas has no ctx.filter */
function tinted(im, w, h, filter){
  const c=document.createElement('canvas'); c.width=Math.round(w); c.height=Math.round(h);
  const x=c.getContext('2d'); x.drawImage(im,0,0,c.width,c.height);
  if(!filter || filter==='none') return c;
  const ops=[...filter.matchAll(/([a-z-]+)\(([-\d.]+)(deg)?\)/g)].map(m=>[m[1],+m[2]]);
  const mats=ops.map(([f,v])=>{
    if(f==='brightness') return [v,0,0,0,v,0,0,0,v,0];
    if(f==='contrast') return [v,0,0,0,v,0,0,0,v,.5-.5*v];
    if(f==='grayscale'){ const a=1-v; return [.2126+.7874*a,.7152-.7152*a,.0722-.0722*a,.2126-.2126*a,.7152+.2848*a,.0722-.0722*a,.2126-.2126*a,.7152-.7152*a,.0722+.9278*a,0]; }
    if(f==='saturate') return [.213+.787*v,.715-.715*v,.072-.072*v,.213-.213*v,.715+.285*v,.072-.072*v,.213-.213*v,.715-.715*v,.072+.928*v,0];
    if(f==='hue-rotate'){ const r=v*Math.PI/180, C=Math.cos(r), S=Math.sin(r);
      return [.213+C*.787-S*.213,.715-C*.715-S*.715,.072-C*.072+S*.928,
              .213-C*.213+S*.143,.715+C*.285+S*.140,.072-C*.072-S*.283,
              .213-C*.213-S*.787,.715-C*.715+S*.715,.072+C*.928+S*.072,0]; }
    return null;
  }).filter(Boolean);
  const img=x.getImageData(0,0,c.width,c.height), d=img.data, cl=n=>n<0?0:n>1?1:n;
  for(let i=0;i<d.length;i+=4){
    if(!d[i+3]) continue;
    let r=d[i]/255, g=d[i+1]/255, b=d[i+2]/255;
    for(const m of mats){ const R=cl(m[0]*r+m[1]*g+m[2]*b+m[9]), G=cl(m[3]*r+m[4]*g+m[5]*b+m[9]), B=cl(m[6]*r+m[7]*g+m[8]*b+m[9]); r=R; g=G; b=B; }
    d[i]=r*255; d[i+1]=g*255; d[i+2]=b*255;
  }
  x.putImageData(img,0,0); return c;
}

function wrapText(x, text, max){
  const parts = lang==='en' ? text.split(/(?<= )/) : [...text], lines=[];
  let cur='';
  for(const p of parts){ if(cur && x.measureText(cur+p).width>max){ lines.push(cur.trimEnd()); cur=p.trimStart(); } else cur+=p; }
  if(cur) lines.push(cur); return lines;
}

async function drawInvoice(no){
  try{ await document.fonts.ready }catch(e){}
  const I = t('inv');
  const list = items(); list.push({ label:I.ship, price:0 });
  const said = I.says(tr(opt('model',state.model),'quote'));
  const m0 = document.createElement('canvas').getContext('2d'); m0.font = `500 30px "Noto Sans TC","PingFang TC",sans-serif`;
  const saidLines = wrapText(m0, said, 1080-168);
  const total = sum(list);
  const W=1080, rowH=72, H=760 + list.length*rowH + 470 + (saidLines.length-1)*42;
  const c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d');
  const hand='"Noto Sans TC","PingFang TC",sans-serif', zh=hand;
  x.fillStyle='#fff'; x.fillRect(0,0,W,H);
  x.strokeStyle='#1b1b1b'; wobblyRect(x,30,30,W-60,H-60,4);

  x.fillStyle='#d9765a'; x.font=`900 80px ${hand}`; x.fillText('CLAWD STORE',80,155);
  x.fillStyle='#1b1b1b'; x.font=`500 34px ${hand}`; x.fillText('RECEIPT',84,210);

  const d=new Date(), p=n=>String(n).padStart(2,'0');
  x.font=`30px ${zh}`; x.fillStyle='#555';
  const meta=[[I.no,no],[I.at,`${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`],[I.who,state.buyer.trim()||I.anon],[I.pay,I.payV]];
  meta.forEach(([k,v],i)=>{ x.fillText(k,84,290+i*48); x.fillStyle='#1b1b1b'; x.fillText(v,lang==='en'?250:240,290+i*48); x.fillStyle='#555'; });

  // clawd
  const im = $('clawdImg');
  const bw=320, k=bw/im.naturalWidth, bh=im.naturalHeight*k, bx=W-90-bw, by=150;
  x.drawImage(tinted(im,bw,bh,opt('shell',state.shell).filter),bx,by,bw,bh);
  // stamp
  x.save(); x.translate(bx+bw-40, by+bh+10); x.rotate(-.2);
  x.strokeStyle='#e8261f'; wobblyRect(x,-170,-50,190,74,5);
  x.fillStyle='#e8261f'; x.font=`700 ${lang==='en'?34:42}px ${zh}`; x.textAlign='center'; x.fillText(I.stamp,-75,2); x.restore();

  let y=540; x.strokeStyle='#1b1b1b'; wobblyLine(x,80,y,W-80,y,3); y+=62;
  for(const it of list){
    x.fillStyle='#1b1b1b'; x.font=`32px ${zh}`;
    let l=it.label; while(x.measureText(l).width>700 && l.length>2) l=l.slice(0,-2)+'…';
    x.fillText(l,84,y);
    x.textAlign='right'; x.font=`500 32px ${hand}`; x.fillStyle = it.price<0 ? '#e8261f' : '#1b1b1b';
    x.fillText(it.price===0 ? 'FREE' : usd(it.price), W-84, y); x.textAlign='left';
    y+=rowH;
  }
  y-=20; x.strokeStyle='#8a8a8a'; x.setLineDash([10,12]); wobblyLine(x,80,y,W-80,y,2.5); x.setLineDash([]);
  y+=100;
  // highlighter
  x.fillStyle='rgba(255,210,31,.75)'; x.save(); x.translate(W-84,y-30); x.rotate(-.02); x.fillRect(-360,-42,380,70); x.restore();
  x.fillStyle='#1b1b1b'; x.font=`700 40px ${zh}`; x.fillText(I.total,84,y);
  x.textAlign='right'; x.font=`900 64px ${hand}`; x.fillText(usd(total),W-84,y+4); x.textAlign='left';
  y+=56; x.fillStyle='#8a8a8a'; x.font=`28px ${zh}`; x.fillText(t('moInv')((total/24).toFixed(2)),84,y);

  y+=60; let bx2=84, r=[...no].reduce((a,ch)=>a+ch.charCodeAt(0),0); x.fillStyle='#1b1b1b';
  while(bx2<W-84){ r=(r*9301+49297)%233280; const w=2+(r%5); if((r>>3)%2) x.fillRect(bx2,y,w,86); bx2+=w+2; }
  y+=140; x.fillStyle='#1b1b1b'; x.font=`500 30px ${zh}`; saidLines.forEach((l,i)=>x.fillText(l,84,y+i*42)); y+=(saidLines.length-1)*42;
  y+=64; x.fillStyle='#8a8a8a'; x.font=`27px ${zh}`;
  I.fine.forEach((l,i)=>x.fillText(l,84,y+i*42));
  return c;
}

  $('modal').classList.add('open'); $('dlBtn').focus();
});
$('closeBtn').onclick = ()=>$('modal').classList.remove('open');
$('modal').addEventListener('click', e=>{ if(e.target.id==='modal') $('closeBtn').click(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && $('modal').classList.contains('open')) $('closeBtn').click(); });

let downloads=null;
(async()=>{ try{ if(window.claude&&window.claude.use) downloads = await window.claude.use('downloads'); }catch(e){} })();
$('dlBtn').onclick = async ()=>{
  if(!blob) return;
  if(!downloads){
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fname;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    toast(t('saved')); return;
  }
  try{ await downloads.save({filename:fname, data:blob}); toast(t('saved')); }
  catch(err){ if(err&&err.code==='declined') return; toast(err&&err.code==='rate_limited' ? t('busy') : t('noDl')); }
};

$('langBtn').onclick = ()=>{
  lang = lang==='en' ? 'zh' : 'en';
  try{ localStorage.setItem('clawd-lang', lang); }catch(e){}
  applyLang();
};
applyLang();
</script>
</body>
</html>
