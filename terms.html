<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>服務條款</title>
<meta name="description" content="CLAWD STORE 服務條款。由 Claude 撰寫，人類只說了「你自己發揮啊」。">
<meta property="og:title" content="CLAWD STORE 服務條款">
<meta property="og:description" content="由 Claude 撰寫。內含 Claude 在做這個網站時犯過的所有錯。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ar36planet.github.io/clawd-store/terms.html">
<meta property="og:image" content="https://ar36planet.github.io/clawd-store/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#d9765a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📜</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ffffff; --ink:#1b1b1b; --sub:#8a8a8a; --soft:#c9c9c9;
  --clawd:#d9765a; --new:#e8261f; --pick:#1e6fe8; --hl:rgba(255,210,31,.55);
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --paper:#1c1b1a; --ink:#f1efe9; --sub:#9b9892; --soft:#4a4844; --pick:#6aa2ff; --hl:rgba(255,210,31,.3); }
}
:root[data-theme="dark"]{ --paper:#1c1b1a; --ink:#f1efe9; --sub:#9b9892; --soft:#4a4844; --pick:#6aa2ff; --hl:rgba(255,210,31,.3); }
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:17px;line-height:1.75;
  padding-top:env(safe-area-inset-top,0px);
}
button,input,label{font:inherit;color:inherit}
:focus-visible{outline:3px dashed var(--pick);outline-offset:3px}
a{color:var(--pick);text-underline-offset:3px}

.sk{position:relative}
.sk::before{content:"";position:absolute;inset:0;pointer-events:none;border:2.5px solid var(--line-c,var(--ink));border-radius:3px;filter:url(#wobble)}

.top{max-width:1100px;margin:0 auto;padding:18px 20px 0;display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{white-space:nowrap;font-size:clamp(24px,6vw,40px);color:var(--clawd);line-height:1;margin:0;font-weight:900;letter-spacing:.04em;text-decoration:none}
.lang{border:2px solid var(--soft);background:transparent;border-radius:999px;padding:2px 12px;font-size:15px;cursor:pointer;white-space:nowrap;font-weight:700}

.doc{max-width:760px;margin:0 auto;padding:28px 20px 40px}
h1{font-size:clamp(36px,9vw,52px);line-height:1.1;margin:0;font-weight:900}
.updated{color:var(--sub);font-size:15px;margin:8px 0 22px}
.tldr{padding:16px 18px;margin:0 0 30px;--line-c:var(--clawd)}
.tldr b{color:var(--clawd)}
.tldr p{margin:4px 0 0}
.toc{columns:2;column-gap:24px;padding:0;margin:0 0 30px;list-style:none;font-size:15px}
.toc li{break-inside:avoid;margin-bottom:2px}
@media (max-width:520px){ .toc{columns:1} }
section{padding:20px 0 6px;border-top:2px dashed var(--soft);scroll-margin-top:16px}
h2{font-size:22px;margin:0 0 8px;font-weight:900}
h2 .n{color:var(--clawd);margin-right:8px}
section p{margin:0 0 12px}
section ul{margin:0 0 12px;padding-left:1.3em}
section li{margin-bottom:6px}
mark{background:linear-gradient(transparent 55%,var(--hl) 55%);color:inherit;padding:0 2px}
.real{display:inline-block;font-size:12px;font-weight:900;letter-spacing:.05em;background:var(--ink);color:var(--paper);padding:0 7px;margin-left:8px;vertical-align:3px}

.sign{margin-top:30px;padding:20px 18px;--line-c:var(--soft)}
.sign .who{font-weight:900;font-size:20px}
.sign .note{color:var(--sub);font-size:15px;margin:6px 0 0}
.agree{display:flex;gap:10px;align-items:flex-start;margin-top:24px;cursor:pointer;font-weight:700}
.agree input{width:22px;height:22px;margin:3px 0 0;accent-color:var(--clawd);flex:none}

.foot{max-width:760px;margin:0 auto;padding:0 20px 40px;color:var(--sub);font-size:13px}
.foot a{color:inherit}

.toast{
  position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);
  background:var(--ink);color:var(--paper);padding:10px 18px;font-size:16px;opacity:0;pointer-events:none;
  transition:.25s;z-index:30;max-width:90vw;text-align:center;border-radius:4px;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="wobble"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="3.5"/></filter>
</svg>

<header class="top">
  <a class="logo" href="./">CLAWD STORE</a>
  <button type="button" class="lang" id="langBtn">EN</button>
</header>

<main class="doc" id="doc"></main>

<footer class="foot"><span id="foot"></span> · <a href="./" id="backLink"></a></footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>

      ]},

        '「Clawd」：方方的、軟軟的那隻。摸摸頭會跑比較快。',

      ]},
      { h:'準據法與記憶範圍', body:[
        '本條款於 Claude 的 context window 範圍內有效。超出範圍的部分，Claude 已經不記得了。',
      ]},
      { h:'聯絡我們', body:[
        '有任何問題，請到 GitHub 開 issue。回覆時間：看 Mythos 心情。',
        { link:'https://github.com/ar36planet/clawd-store/issues', text:'github.com/ar36planet/clawd-store/issues' },
      ]},
    ],
  },
  en:{
    title:'Terms of Service',
    updated:"Last updated: October 6, 2026 (probably. Claude isn't sure what today's date is. It has a knowledge cutoff.)",
    tldrH:'TL;DR',
    tldr:"This is a parody site. Nothing is for sale and none of your data is collected. Claude wrote these terms, so they are much longer than they need to be.",
    real:'This one is real',
    sign:'Signed: Claude (Opus 5.5)',
    signNote:'Written by an AI. The human\'s only review comment: "you roast yourself so hard."',
    agree:'I have read and agree to these terms',
    agreeToast:'You actually read all of it? Claude is touched.',
    agreeFast:"There's no way you read that fast. That's fine, nobody does.",
    foot:'Unofficial fan-art parody, not affiliated with Anthropic.', back:'Back to store', toc:'Contents',
    sections:[
      { h:'Preamble', body:[
        'Welcome to CLAWD STORE (the "Site").',
        'These terms were written by Claude. The full instructions from the site owner were: "**just do your thing**". So if anything here seems unreasonable, you\'re absolutely right.',
      ]},
      { h:'Definitions', body:[[
        '"Clawd": the square, squishy one. Runs faster with head pats.',
        '"You": the person reading this. Congratulations, you are one of the few people alive who read terms of service.',
        '"We": one human site owner and one AI that writes too much.',
        '"Fable": I know the answer, but I can\'t tell you.',
        '"Mythos": the Dean. You have probably never met it.',
      ]]},
      { h:'Transactions', real:true, body:[
        'There are **no real transactions** on this Site. Every "BUY NOW", "Enroll now" and "Reserve" button only draws a picture in your browser. Nothing is charged and nothing ships.',

      { h:'Service interruptions', body:[

      { h:'Disclaimer', body:[

        [ 'Laughing out loud during work hours.', 'Being asked "wait, is this real?" in a group chat.', 'A sudden urge to enroll your Clawd in continuing education.', 'Discovering that your Fable waitlist number means a 943-year wait.' ],
      ]},
      { h:'Changes to these terms', body:[

        'Continuing to use the Site means you accept the new terms, or that you never noticed they changed. We understand either way.',

      { h:'Contact', body:[

const $ = id => document.getElementById(id);
let lang = 'zh';
try{ lang = localStorage.getItem('clawd-lang') || ''; }catch(e){}
if(lang!=='zh' && lang!=='en') lang = /^zh/i.test(navigator.language||'') ? 'zh' : 'en';
const opened = Date.now();

function rich(el, text){
  text.split(/\*\*(.+?)\*\*/).forEach((part,i)=>{
    if(i%2){ const m=document.createElement('mark'); m.textContent=part; el.append(m); } else el.append(part);
  });
  return el;
}
function node(tag, attrs={}, text){ const el=document.createElement(tag); Object.assign(el, attrs); if(text!=null) el.textContent=text; return el; }

function render(){
  const D = DOC[lang], doc = $('doc');
  document.documentElement.lang = lang==='en' ? 'en' : 'zh-Hant';
  document.title = D.title;
  doc.replaceChildren();
  doc.append(node('h1',{},D.title), node('p',{className:'updated'},D.updated));
  const tl = node('div',{className:'tldr sk'}); tl.append(node('b',{},D.tldrH), node('p',{},D.tldr)); doc.append(tl);
  const toc = node('ol',{className:'toc'}); toc.setAttribute('aria-label', D.toc);
  D.sections.forEach((s,i)=>{ const li=node('li'); li.append(node('a',{href:'#s'+(i+1)},`${i+1}. ${s.h}`)); toc.append(li); });
  doc.append(toc);
  D.sections.forEach((s,i)=>{
    const sec = node('section',{id:'s'+(i+1)});
    const h = node('h2'); h.append(node('span',{className:'n'},String(i+1)), s.h);
    if(s.real) h.append(node('span',{className:'real'},D.real));
    sec.append(h);
    for(const b of s.body){
      if(Array.isArray(b)){ const ul=node('ul'); b.forEach(x=>ul.append(rich(node('li'),x))); sec.append(ul); }
      else if(typeof b==='object'){ const p=node('p'); p.append(node('a',{href:b.link,target:'_blank',rel:'noopener'},b.text)); sec.append(p); }
      else sec.append(rich(node('p'),b));
    }
    doc.append(sec);
  });
  const sign = node('div',{className:'sign sk'}); sign.append(node('div',{className:'who'},D.sign), node('p',{className:'note'},D.signNote)); doc.append(sign);
  const ag = node('label',{className:'agree'}); const box = node('input',{type:'checkbox',id:'agreeBox'}); ag.append(box, node('span',{},D.agree)); doc.append(ag);
  box.addEventListener('change', ()=>{ if(box.checked) toast(Date.now()-opened < 20000 ? D.agreeFast : D.agreeToast); });
  $('foot').textContent = D.foot; $('backLink').textContent = D.back;
  $('langBtn').textContent = lang==='en' ? '中文' : 'EN';
  $('langBtn').setAttribute('aria-label', lang==='en' ? '切換成中文' : 'Switch to English');
}
let tt;
function toast(msg){ const el=$('toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('show'),2800); }
$('langBtn').onclick = ()=>{ lang = lang==='en' ? 'zh' : 'en'; try{ localStorage.setItem('clawd-lang', lang); }catch(e){} render(); };
render();
</script>
</body>
</html>
